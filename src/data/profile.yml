  summary: >-
    My expertise lies at the intersection of biomedical image analysis and artificial intelligence (AI).
    I have experience applying deep learning algorithms to biological datasets, such as mass spectrometry
    imaging (MSI) and histopathological whole slide images (WSI), to facilitate clinical translation and
    pathway analysis. My research leveraged architectures such as variational autoencoders and multi-task
    graph transformers to optimize label-free tissue segmentation, simultaneous cancer detection, and
    disease staging across molecular and cellular levels. To facilitate multidisciplinary approaches in
    applied biomedical research, I developed plug-and-play MATLAB graphical user interfaces (e.g., i2i 2.0)
    that deploy complex image registration, CNNs, and dimensionality reduction tools for end-users. This
    computational expertise is reinforced by peer-reviewed publications, the supervision of Master's
    thesis projects, and teaching assistantships in B.Sc./M.Sc. courses.
